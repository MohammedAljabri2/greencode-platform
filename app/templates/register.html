{% extends "base.html" %}
{% block title %}Register - GreenCode Platform{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px; margin: 40px auto;">
    <h2 style="margin-top: 0; color: #1f7a5a;">📝 Create Account</h2>
    <p style="color: #555; margin-bottom: 20px;">Register a new GreenCode account.</p>

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required autofocus>

        <label>Password</label>
        <input type="password" name="password" required minlength="4">

        <label>Role</label>
        <select name="role" required>
            <option value="DEVELOPER">Developer</option>
            <option value="PROJECT_MANAGER">Project Manager</option>
            <option value="ADMIN">Admin</option>
        </select>

        <button type="submit" class="btn" style="width: 100%;">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 20px; color: #555;">
        Already have an account?
        <a href="{{ url_for('main.login') }}" style="color: #1f7a5a; font-weight: bold;">Sign in here</a>
    </p>
</div>
{% endblock %}
