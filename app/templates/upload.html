{% extends "base.html" %}
{% block title %}Upload Project - GreenCode Platform{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px; margin: 20px auto;">
    <h2 style="margin-top: 0; color: #1f7a5a;">📤 Upload Project</h2>
    <p style="color: #555;">The uploaded project will be owned by you ({{ current_user.username }}).</p>

    <form method="POST" enctype="multipart/form-data">
        <label>Project Name</label>
        <input type="text" name="project_name" required placeholder="e.g. My Web App">

        <label>Version Label</label>
        <input type="text" name="version_label" required placeholder="e.g. v1.0">

        <label>Source File</label>
        <input type="file" name="source_file" accept=".py,.java,.txt" required>
        <p style="font-size: 13px; color: #777; margin-top: -8px;">
            Accepted: .py, .java, .txt (max 50 MB)
        </p>

        <button type="submit" class="btn">Upload and Analyze</button>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-red">Cancel</a>
    </form>
</div>
{% endblock %}
